# ===========================================================================
# StockGambling - local development infrastructure
# ===========================================================================
# Brings up: postgres, redis, api, web, worker.
#
#   docker compose up -d --build      start everything
#   docker compose ps                 check health
#   docker compose logs -f api        tail the API
#   docker compose down -v            stop and delete volumes (DESTRUCTIVE)
#
# No Kubernetes, no microservice split: five services is the whole topology.
# ===========================================================================

name: stockgambling

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_NAME: ${APP_NAME:-stockgambling-api}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}
  # In-container service hostnames, never `localhost`.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-stockgambling}
  POSTGRES_USER: ${POSTGRES_USER:-stockgambling}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockgambling}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  CELERY_RESULT_BACKEND_DB: 1
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  CEDEAR_METADATA_PROVIDER: ${CEDEAR_METADATA_PROVIDER:-}
  UNDERLYING_PROVIDER: ${UNDERLYING_PROVIDER:-}
  UNDERLYING_PROVIDER_API_KEY: ${UNDERLYING_PROVIDER_API_KEY:-}
  FX_PROVIDER: ${FX_PROVIDER:-}
  FX_PROVIDER_API_KEY: ${FX_PROVIDER_API_KEY:-}

services:
  # -------------------------------------------------------------------------
  # PostgreSQL - system of record for instruments, prices, models, backtests.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: stockgambling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockgambling}
      POSTGRES_USER: ${POSTGRES_USER:-stockgambling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockgambling}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [stockgambling]

  # -------------------------------------------------------------------------
  # Redis - Celery broker, Celery result backend, application cache.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stockgambling-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [stockgambling]

  # -------------------------------------------------------------------------
  # API - FastAPI. Serves predictions and metadata, never runs training.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stockgambling/backend:0.1.0
    container_name: stockgambling-api
    restart: unless-stopped
    environment: *backend-env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
    ports:
      - "${API_EXPOSE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [stockgambling]

  # -------------------------------------------------------------------------
  # Worker - Celery. Ingestion, feature builds, training and backtests.
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stockgambling/backend:0.1.0
    container_name: stockgambling-worker
    restart: unless-stopped
    environment: *backend-env
    command:
      - celery
      - --app
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel
      - INFO
      - --concurrency
      - ${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL so that $$HOSTNAME is expanded by the container's shell.
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app:celery_app inspect ping -d "celery@$$HOSTNAME" | grep -q pong
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks: [stockgambling]

  # -------------------------------------------------------------------------
  # Web - Next.js dashboard.
  # -------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stockgambling/frontend:0.1.0
    container_name: stockgambling-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_EXPOSE_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [stockgambling]

networks:
  stockgambling:
    name: stockgambling
    driver: bridge

volumes:
  postgres-data:
    name: stockgambling-postgres-data
  redis-data:
    name: stockgambling-redis-data
